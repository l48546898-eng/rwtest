name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build main.exe
        shell: cmd
        run: cl /O2 /EHsc /DUNICODE /D_UNICODE main.cpp /link /OUT:main.exe /MANIFEST:EMBED /MANIFESTINPUT:main.manifest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: main
          path: main.exe
